<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Living screenshots</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>
  <main class="app" id="app">
    <section class="workspace">
      <header class="topbar">
        <div class="title"><span class="mark" data-icon="Layers"></span><h1>Living screenshots</h1></div>
        <div class="top-actions">
          <button class="icon-button" id="resetAll" aria-label="Reset app" title="Reset app and clear saved settings" data-icon="RotateCcw"></button>
          <button class="icon-button" id="resetView" aria-label="Reset camera" title="Reset camera" data-icon="Camera"></button>
          <button class="icon-button" id="openSettings" aria-label="Settings" title="Settings" data-icon="Settings"></button>
          <button class="icon-button" id="panelToggle" aria-label="Collapse controls" title="Collapse controls" aria-expanded="true" data-icon="PanelRightClose"></button>
        </div>
      </header>
      <div class="viewport" id="viewport">
        <div class="render-status" id="renderStatus" role="status">Loading scene</div>
        <div class="canvas-controls">
          <label class="check-control"><input type="checkbox" id="canvasGrid" checked><span>Grid</span></label>
          <label class="background-control">Background<input type="range" id="canvasBg" min="0" max="100" step="1" value="0" aria-label="Background from white to black"></label>
          <div class="finish-control"><span>Finish</span><button class="finish-swatch gray" data-finish="gray" aria-label="Space Gray" title="Space Gray" aria-pressed="true"></button><button class="finish-swatch silver" data-finish="silver" aria-label="Silver" title="Silver" aria-pressed="false"></button><input type="color" id="bodyColor" value="#4f5560" aria-label="Laptop body color" title="Laptop body color"></div>
          <label class="color-control">Screen<input type="color" id="screenColor" value="#e8f3f0" aria-label="Screen color" title="Screen color"></label>
        </div>
      </div>
    </section>
    <aside class="panel" id="panel" aria-label="Scene controls">
      <div class="panel-inner">
        <section class="section asset-section">
          <div class="section-heading">Assets</div>
          <div class="select-row"><label for="assetSetSelect">Demo</label><select id="assetSetSelect"><option>Dashboard demo</option><option>Chess Demo</option></select></div>
          <div class="asset-actions" id="localAssetActions" hidden><button id="chooseAssetsFolder" class="command-button"><span data-icon="FolderOpen"></span>Choose Folder</button><button id="rescanAssetsFolder" class="icon-button" data-icon="RefreshCw" aria-label="Rescan folders" title="Rescan folders"></button></div>
          <p class="asset-status" id="assetStatus" role="status"></p>
        </section>
        <details class="section" open><summary>Scene Orientation</summary><div class="section-body" id="sceneControls"></div></details>
        <details class="section" open><summary>Laptop</summary><div class="section-body"><label class="check-control"><input type="checkbox" id="laptopVisible" checked>Visible</label><div id="laptopControls"></div></div></details>
        <details class="section" open><summary>Living Motion</summary><div class="section-body"><div class="select-row"><span>Animation</span><button class="command-button play-button" id="animationToggle" aria-label="Pause animation" aria-pressed="true"><span data-icon="Pause"></span><span id="animationLabel">Pause</span></button></div><div class="select-row"><label for="animationAxis">Axis</label><select id="animationAxis"><option value="y">Y pivot</option><option value="x">X pivot</option><option value="z">Z pivot</option></select></div><div id="animationControls"></div></div></details>
        <div id="layerControls"></div>
      </div>
    </aside>
  </main>
  <dialog id="settingsModal"><form method="dialog"><header><h2>Settings</h2><button class="icon-button" aria-label="Close settings" title="Close settings" data-icon="X"></button></header><label class="check-control"><input type="checkbox" id="highQuality">High resolution</label><button id="resetApp" type="button" class="command-button reset-button"><span data-icon="RotateCcw"></span>Reset App</button></form></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
