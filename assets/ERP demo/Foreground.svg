<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1037" viewBox="0 0 1920 1037" fill="none">
  <title>Ledger ERP: floating finance query and close-readiness status</title>
  <desc>A floating prompt asks for subsidiary financial performance. A separate close-readiness panel shows 28 of 32 tasks complete, with four remaining.</desc>
  <rect x="96" y="876" width="1120" height="78" rx="6" fill="#294358" stroke="#506d82" stroke-width="1.5"/>
  <path d="M120 893V922" stroke="#81dbe1" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 925V938" stroke="#ee9285" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="144" y="900" font-size="12" fill="#9cbbce">ASK LEDGER</text>
    <text x="144" y="933" font-size="25" fill="#eef4f7">Show financial performance across all subsidiaries.</text>
  </g>
  <rect x="1148" y="895" width="46" height="42" rx="4" fill="#37586e" stroke="#608094"/>
  <path d="M1162 916H1180M1173 909L1180 916 1173 923" stroke="#c8e5ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1272" y="832" width="552" height="122" rx="6" fill="#223b4e" stroke="#486577" stroke-width="1.5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="1298" y="866" font-size="21" font-weight="700" fill="#dce9f0">Close readiness</text>
    <text x="1298" y="896" font-size="16" fill="#a6bfce">28 of 32 tasks complete</text>
    <text x="1798" y="895" text-anchor="end" font-size="16" fill="#dfba75">4 remaining</text>
    <text x="1298" y="940" font-size="13" fill="#8faabd">October 2026 / Review in progress</text>
  </g>
  <rect x="1298" y="910" width="500" height="6" rx="3" fill="#395669"/>
  <rect x="1298" y="910" width="437.5" height="6" rx="3" fill="#7bc2bd"/>
</svg>
