<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123e96">
  <title>Blueprint Study - Living Screenshots</title>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#d5f2ff;background:#123e96;letter-spacing:0;color-scheme:dark;--paper:#123e96;--ink:#d5f2ff;--rule:#74b9f14a}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button,input,select{accent-color:#a6deff}a{color:inherit;text-decoration:none}button,select{color:inherit;border:1px solid var(--rule);background:transparent;border-radius:4px}button{cursor:pointer}button:disabled{opacity:.4;cursor:wait}button:hover,select:hover{background:#a6d8ff15}button svg,a svg{width:19px;height:19px;display:block;flex:none}
    header{min-height:72px;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--rule)}.identity{display:flex;align-items:center;gap:20px;min-width:0}.brand{display:flex;align-items:center;gap:9px;font-size:14px}.divider{height:20px;width:1px;background:var(--rule)}h1{font-size:19px;line-height:1.2;margin:0;font-weight:500}.mode{display:flex;gap:0;border:1px solid var(--rule);border-radius:4px;flex:none}.mode button{border:0;border-radius:0;font-size:13px;padding:9px 14px;min-width:88px}.mode button[aria-pressed=true]{color:var(--paper);background:var(--ink)}
    main{flex:1;min-height:0;display:grid;place-items:center;padding:20px 24px}.stage{width:min(100%,calc((100svh - 180px)*16/9));aspect-ratio:16/9;position:relative;background-color:var(--paper);isolation:isolate;overflow:hidden}.stage.grid{background-image:linear-gradient(to right,#a6d8ff08 1px,transparent 1px),linear-gradient(to bottom,#a6d8ff08 1px,transparent 1px),linear-gradient(to right,#a6d8ff0e 1px,transparent 1px),linear-gradient(to bottom,#a6d8ff0e 1px,transparent 1px);background-size:20px 20px,20px 20px,100px 100px,100px 100px}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.status{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}.status[hidden]{display:none}.stage:before,.stage:after{content:'';position:absolute;pointer-events:none;width:20px;height:20px;border-color:var(--rule);border-style:solid;z-index:1}.stage:before{top:0;left:0;border-width:1px 0 0 1px}.stage:after{bottom:0;right:0;border-width:0 1px 1px 0}
    footer{border-top:1px solid var(--rule);padding:15px 28px;display:flex;gap:24px;align-items:center;justify-content:space-between;min-height:66px}.controls{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.control{display:flex;align-items:center;gap:9px;font-size:13px;white-space:nowrap}select{height:34px;min-width:110px;padding:0 24px 0 9px}select option{background:var(--paper);color:var(--ink)}input[type=checkbox]{width:15px;height:15px;margin:0}input[type=range]{width:124px;margin:0}output{display:inline-block;min-width:29px;font-family:monospace;font-size:12px;text-align:right}.actions{display:flex;gap:8px}.icon-button{width:36px;height:36px;display:grid;place-items:center}.drawing{font-family:monospace;font-size:11px;line-height:1.7;text-align:right;white-space:nowrap;color:inherit;opacity:.65}html[data-mode=original]{--paper:#f3f6f8;--ink:#253d4d;--rule:#8b9da542;color:#253d4d;background:#f3f6f8;color-scheme:light}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    @media(max-width:700px){header{padding:14px 16px;gap:12px;flex-wrap:wrap}.brand{font-size:12px}.identity{gap:12px}h1{font-size:17px}.mode{margin-left:auto}.mode button{min-width:80px;padding:8px 10px}main{padding:18px 12px}.stage{width:100%}footer{padding:14px 16px;gap:12px;align-items:flex-start;flex-wrap:wrap}.controls{gap:14px 18px}.control{font-size:12px;gap:7px}.drawing{display:none}input[type=range]{width:105px}.actions{margin-left:auto}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body>
  <header>
    <div class="identity"><a class="brand" href="index.html"><span data-icon="Layers"></span><span>Living screenshots</span></a><span class="divider"></span><h1>Blueprint study</h1></div>
    <div class="mode" role="group" aria-label="Rendering style"><button id="blueprintMode" aria-pressed="true">Blueprint</button><button id="originalMode" aria-pressed="false">Original</button></div>
  </header>
  <main><div class="stage grid" id="stage"><div class="status" id="status" role="status">Loading drawing</div></div></main>
  <footer>
    <div class="controls">
      <label class="control">Device<select id="device"><option value="laptop">Laptop</option><option value="desktop">Desktop</option></select></label>
      <label class="control"><input type="checkbox" id="hiddenEdges">Hidden edges</label>
      <label class="control"><input type="checkbox" id="grid" checked>Grid</label>
      <label class="control">Depth<input id="depth" type="range" min="0" max="2.5" step="0.05" value="1.2"><output id="depthValue" for="depth">1.20</output></label>
      <div class="actions"><button class="icon-button" id="play" title="Pause animation" aria-label="Pause animation" aria-pressed="true" disabled><span data-icon="Pause"></span></button><button class="icon-button" id="resetCamera" title="Reset camera" aria-label="Reset camera" disabled><span data-icon="Camera"></span></button></div>
    </div>
    <div class="drawing">ALDER HOUSE / A-101<br>FLOOR / STRUCTURE / ANALYSIS / DETAIL</div>
  </footer>
  <script type="module" src="blueprint-study.js"></script>
</body>
</html>
